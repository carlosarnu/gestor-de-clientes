<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Clientes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor">
      <h1>Gestor de Clientes</h1>
    </div>
  </header>

  <main class="contenedor">

    <!-- Formulario para registrar un cliente -->
    <section class="panel" id="panel-formulario">
      <h2 id="titulo-formulario">Nuevo cliente</h2>

      <form id="formulario-cliente">
        <div class="campo">
          <label for="empresa">Nombre de la empresa</label>
          <input type="text" id="empresa" name="empresa" autocomplete="organization">
        </div>

        <div class="campo">
          <label for="cif">CIF/NIF</label>
          <input type="text" id="cif" name="cif" autocomplete="off">
        </div>

        <div class="campo">
          <label for="contacto">Persona de contacto</label>
          <input type="text" id="contacto" name="contacto" autocomplete="name">
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel">
        </div>

        <div class="campo">
          <label for="movil">Móvil</label>
          <input type="tel" id="movil" name="movil" autocomplete="off">
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email">
        </div>

        <div class="campo">
          <label for="direccion">Dirección física</label>
          <input type="text" id="direccion" name="direccion" autocomplete="street-address">
        </div>

        <div class="campo">
          <label for="codigo-postal">Código postal</label>
          <input type="text" id="codigo-postal" name="codigoPostal" autocomplete="postal-code" inputmode="numeric">
        </div>

        <div class="campo">
          <label for="tipo">Tipo de cliente</label>
          <select id="tipo" name="tipo" autocomplete="off">
            <option value="" selected disabled>Selecciona un tipo</option>
            <option value="Tela">Tela</option>
            <option value="Espuma">Espuma</option>
            <option value="Estructuras">Estructuras</option>
            <option value="Otros">Otros</option>
          </select>
        </div>

        <!-- Tipo escrito a mano: solo aparece con «Otros» (spec 008, RF-601/RF-602) -->
        <div class="campo" id="campo-tipo-otro" hidden>
          <label for="tipo-otro">Escribe el tipo de cliente</label>
          <input type="text" id="tipo-otro" name="tipoOtro" autocomplete="off" maxlength="40" placeholder="p. ej. Toldos">
        </div>

        <div class="campo campo-completo">
          <label for="notas">Información adicional / Notas</label>
          <textarea id="notas" name="notas" autocomplete="off" rows="4"></textarea>
        </div>

        <div class="campo campo-completo">
          <div class="acciones-formulario">
            <button type="submit" class="boton-principal" id="boton-guardar">Guardar cliente</button>
            <button type="button" class="boton-secundario" id="boton-cancelar" hidden>Cancelar</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Lista de clientes -->
    <section class="panel">
      <!-- Cabecera de contexto impresa (spec 013, RF-1103): existe SOLO para el
           papel; en pantalla está oculta (styles.css) y el texto lo rellena app.js
           en el evento «beforeprint», al imprimir -->
      <p class="cabecera-impresion" id="cabecera-impresion" aria-hidden="true"></p>

      <div class="lista-cabecera">
        <h2>Clientes</h2>

        <!-- Conmutador de vista (spec 012, RF-1001): «Tarjetas» activo por defecto;
             el estado (vistaActual) vive solo en memoria, sin persistencia -->
        <div class="conmutador" id="conmutador" role="group" aria-label="Forma de ver la lista">
          <button type="button" class="activo" data-vista="tarjetas" aria-pressed="true">Tarjetas</button>
          <button type="button" data-vista="listado" aria-pressed="false">Listado</button>
        </div>

        <!-- Botón «Imprimir» (spec 013, RF-1101): tras el conmutador y visible en las
             dos vistas; imprime lo que se ve y no toca datos, filtro, búsqueda ni vista -->
        <button type="button" class="boton-secundario" id="boton-imprimir">Imprimir</button>

        <p class="contador" id="contador"></p>
      </div>

      <!-- Buscador por texto (spec 005) -->
      <div class="buscador">
        <label for="buscador">Buscar cliente</label>
        <input type="search" id="buscador" autocomplete="off"
               placeholder="Empresa, contacto, CIF…">
      </div>

      <div class="filtros" id="filtros">
        <button type="button" class="filtro activo" data-filtro="Todos">Todos</button>
        <button type="button" class="filtro" data-filtro="Tela">Tela</button>
        <button type="button" class="filtro" data-filtro="Espuma">Espuma</button>
        <button type="button" class="filtro" data-filtro="Estructuras">Estructuras</button>
        <button type="button" class="filtro" data-filtro="Otros">Otros</button>
      </div>

      <!-- Copia de seguridad (spec 011, RF-901): exportar e importar -->
      <div class="copia-seguridad">
        <button type="button" class="boton-secundario" id="boton-exportar">Exportar</button>
        <button type="button" class="boton-secundario" id="boton-importar">Importar</button>
        <input type="file" id="archivo-importar" accept=".json,application/json" hidden>
      </div>

      <!-- Confirmación EN LÍNEA de la importación (estilo «¿Seguro?», nunca confirm()/alert()) -->
      <div class="confirmacion-importacion" id="confirmacion-importacion" hidden>
        <p class="confirmacion-importacion-texto" id="confirmacion-importacion-texto"></p>
        <button type="button" class="boton-secundario boton-reemplazar" id="boton-reemplazar">Sí, reemplazar</button>
        <button type="button" class="boton-secundario" id="boton-cancelar-importacion">Cancelar</button>
      </div>

      <!-- Selector de campos del listado (spec 012, RF-1002): chips con estado de
           casilla, generados desde CATALOGO_CAMPOS; oculto en vista «Tarjetas» -->
      <div class="selector-campos" id="selector-campos" hidden>
        <p class="selector-campos-titulo" id="selector-campos-titulo">Campos del listado</p>
        <div class="chips" id="chips" role="group" aria-labelledby="selector-campos-titulo"></div>
      </div>

      <div class="lista-clientes" id="lista-clientes"></div>
    </section>

  </main>

  <!-- Aviso breve tipo toast (Cliente actualizado / Cliente eliminado) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="logica.js"></script>
  <script src="app.js"></script>
</body>
</html>
