<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Clientes</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Hoja de impresión (spec 017, RF-1510/RF-1511): media="print" = el papel es
       su estado por defecto (Ctrl+P funciona aunque la vista previa nunca se
       haya abierto); la vista previa (app.js, T-04) conmuta este media a "all"
       mientras dura. Va DESPUÉS de styles.css para ganar por orden de cascada a
       igual especificidad (cabecera-impresion, lista-clientes a 1 columna) -->
  <link rel="stylesheet" href="hoja-impresion.css" media="print" id="estilo-hoja">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor">
      <h1>Gestor de Clientes</h1>
    </div>
  </header>

  <main class="contenedor">

    <!-- Formulario para registrar un cliente -->
    <section class="panel" id="panel-formulario">
      <h2 id="titulo-formulario">Nuevo cliente</h2>

      <form id="formulario-cliente">
        <div class="campo">
          <label for="empresa">Nombre de la empresa</label>
          <input type="text" id="empresa" name="empresa" autocomplete="organization">
        </div>

        <div class="campo">
          <label for="cif">CIF/NIF</label>
          <input type="text" id="cif" name="cif" autocomplete="off">
        </div>

        <div class="campo">
          <label for="contacto">Persona de contacto</label>
          <input type="text" id="contacto" name="contacto" autocomplete="name">
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel">
        </div>

        <div class="campo">
          <label for="movil">Móvil</label>
          <input type="tel" id="movil" name="movil" autocomplete="off">
        </div>

        <!-- Email como texto libre (revisión global, M4): type="email" impedía
             guardar escrituras como «sin correo» con checkValidity/reportValidity
             y la burbuja nativa podía salir en inglés (interfaz 100% española) -->
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="text" id="email" name="email" autocomplete="email">
        </div>

        <div class="campo">
          <label for="direccion">Dirección física</label>
          <input type="text" id="direccion" name="direccion" autocomplete="street-address">
        </div>

        <div class="campo">
          <label for="codigo-postal">Código postal</label>
          <input type="text" id="codigo-postal" name="codigoPostal" autocomplete="postal-code" inputmode="numeric">
        </div>

        <!-- Provincia (spec 015, RF-1302): campo combinado — el datalist solo
             SUGIERE las 52 provincias/ciudades de España (las 4 principales
             primero: Valencia, Alicante, Castellón, Murcia; el resto
             alfabético) y se permite escribir cualquier texto libre; nada es
             obligatorio (spec 007) y sin maxlength (la lógica solo recorta) -->
        <div class="campo">
          <label for="provincia">Provincia</label>
          <input type="text" id="provincia" name="provincia" list="lista-provincias" autocomplete="address-level2">
          <datalist id="lista-provincias">
            <option value="Valencia"></option>
            <option value="Alicante"></option>
            <option value="Castellón"></option>
            <option value="Murcia"></option>
            <option value="A Coruña"></option>
            <option value="Álava"></option>
            <option value="Albacete"></option>
            <option value="Almería"></option>
            <option value="Asturias"></option>
            <option value="Ávila"></option>
            <option value="Badajoz"></option>
            <option value="Barcelona"></option>
            <option value="Bizkaia"></option>
            <option value="Burgos"></option>
            <option value="Cáceres"></option>
            <option value="Cádiz"></option>
            <option value="Cantabria"></option>
            <option value="Ceuta"></option>
            <option value="Ciudad Real"></option>
            <option value="Córdoba"></option>
            <option value="Cuenca"></option>
            <option value="Gipuzkoa"></option>
            <option value="Girona"></option>
            <option value="Granada"></option>
            <option value="Guadalajara"></option>
            <option value="Huelva"></option>
            <option value="Huesca"></option>
            <option value="Illes Balears"></option>
            <option value="Jaén"></option>
            <option value="La Rioja"></option>
            <option value="Las Palmas"></option>
            <option value="León"></option>
            <option value="Lleida"></option>
            <option value="Lugo"></option>
            <option value="Madrid"></option>
            <option value="Málaga"></option>
            <option value="Melilla"></option>
            <option value="Navarra"></option>
            <option value="Ourense"></option>
            <option value="Palencia"></option>
            <option value="Pontevedra"></option>
            <option value="Salamanca"></option>
            <option value="Santa Cruz de Tenerife"></option>
            <option value="Segovia"></option>
            <option value="Sevilla"></option>
            <option value="Soria"></option>
            <option value="Tarragona"></option>
            <option value="Teruel"></option>
            <option value="Toledo"></option>
            <option value="Valladolid"></option>
            <option value="Zamora"></option>
            <option value="Zaragoza"></option>
          </datalist>
        </div>

        <!-- Tipo de cliente (spec 016 → SELECCIÓN MÚLTIPLE con casillas): cuatro
             casillas que se marcan de una en una (varias a la vez o ninguna) y
             campo de texto condicional que SOLO aparece al marcar «Otros» (hidden,
             sin espacio; el texto se descarta al desmarcar, RF-1402).
             Mapeo al guardar en tiposDesdeCasillas() (logica.js): nada → «Sin tipo»;
             fijos en orden canónico; texto libre tras los fijos; «Otros» sin texto →
             «Otros»; texto igual a un fijo → fijo (RF-1403). -->
        <div class="campo">
          <span class="campo-etiqueta">Tipo de cliente</span>
          <div class="casillas-tipos" role="group" aria-label="Tipo de cliente">
            <label class="casilla" for="tipo-tela">
              <input type="checkbox" id="tipo-tela" value="Tela">
              <span>Tela</span>
            </label>
            <label class="casilla" for="tipo-espuma">
              <input type="checkbox" id="tipo-espuma" value="Espuma">
              <span>Espuma</span>
            </label>
            <label class="casilla" for="tipo-estructuras">
              <input type="checkbox" id="tipo-estructuras" value="Estructuras">
              <span>Estructuras</span>
            </label>
            <label class="casilla" for="tipo-otros">
              <input type="checkbox" id="tipo-otros" value="Otros">
              <span>Otros</span>
            </label>
          </div>
        </div>
        <div class="campo campo-condicional" id="campo-tipo-otro" hidden>
          <label for="tipo-otro">Escribe el tipo de cliente</label>
          <input type="text" id="tipo-otro" name="tipoOtro" maxlength="40" placeholder="p. ej. Toldos" autocomplete="off">
        </div>

        <div class="campo campo-completo">
          <label for="notas">Información adicional / Notas</label>
          <textarea id="notas" name="notas" autocomplete="off" rows="4"></textarea>
        </div>

        <div class="campo campo-completo">
          <div class="acciones-formulario">
            <button type="submit" class="boton-principal" id="boton-guardar">Guardar cliente</button>
            <button type="button" class="boton-secundario" id="boton-cancelar" hidden>Cancelar</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Lista de clientes -->
    <section class="panel">
      <!-- Barra de la vista previa de impresión (spec 017, RF-1504): SOLO se ve
           con la vista previa abierta (hidden por defecto; la alterna app.js y en
           el papel/PDF la oculta la regla mecánica del @media print de styles.css).
           Es SCREEN: no es regla de hoja y no viaja a hoja-impresion.css (Decisión
           9 del plan). Tres botones en español con las clases de siempre
           (.boton-principal / .boton-secundario: ≥44 px y foco visible); el foco al
           abrir cae en el primero, «Imprimir» (RF-1504). El <p> de estado es el
           aviso del «Guardar como PDF» en escritorio (RF-1506): el toast de
           siempre es CHROME y la hoja lo oculta en la vista previa (RF-1501), así
           que el resultado («PDF guardado…» / «No se pudo generar el PDF») se
           muestra AQUÍ, dentro de la propia vista previa; lo vacía app.js al
           cerrar. role="status" para que lectores de pantalla lo anuncien -->
      <div class="barra-vista-previa" id="barra-vista-previa" hidden>
        <button type="button" class="boton-principal" id="boton-vp-imprimir">Imprimir</button>
        <button type="button" class="boton-secundario" id="boton-vp-pdf">Guardar como PDF</button>
        <button type="button" class="boton-secundario" id="boton-vp-cerrar">Cerrar</button>
        <p class="estado-vp" id="estado-vp" role="status" hidden></p>
      </div>

      <!-- Cabecera de contexto de la hoja (spec 013, RF-1103 → spec 017, RF-1503):
           existe SOLO para la hoja; en pantalla está oculta (styles.css) y la
           muestra hoja-impresion.css (media="print" / vista previa). El texto lo
           rellena app.js fresco en «beforeprint» (Ctrl+P, RF-1509) y al abrir la
           vista previa. SIN aria-hidden: display:none ya la saca de lectores en
           pantalla y en la vista previa queda legible (RF-1503; decisión 3.3 del
           plan de la 017) -->
      <p class="cabecera-impresion" id="cabecera-impresion"></p>

      <div class="lista-cabecera">
        <h2>Clientes</h2>

        <!-- Conmutador de vista (spec 012, RF-1001): «Tarjetas» activo por defecto;
             el estado (vistaActual) vive solo en memoria, sin persistencia -->
        <div class="conmutador" id="conmutador" role="group" aria-label="Forma de ver la lista">
          <button type="button" class="activo" data-vista="tarjetas" aria-pressed="true">Tarjetas</button>
          <button type="button" data-vista="listado" aria-pressed="false">Listado</button>
        </div>

        <!-- Botón «Imprimir» (spec 013, RF-1101): tras el conmutador y visible en las
             dos vistas; imprime lo que se ve y no toca datos, filtro, búsqueda ni vista -->
        <button type="button" class="boton-secundario" id="boton-imprimir">Imprimir</button>

        <p class="contador" id="contador"></p>
      </div>

      <!-- Barra de filtros (spec 018, RF-1601/RF-1602/RF-1603): EXACTAMENTE dos
           desplegables con casillas —«Tipo de cliente» y «Provincia»— ocupando el
           hueco de las pestañas (RF-1205/RF-104 derogados) y del <select> único de
           provincia de la 015 (RF-1305 derogado), ANTES del buscador que queda al
           final de la barra. Cada desplegable: un trigger <button> con su etiqueta
           dinámica («Tipo: Todos» / «Tipo: Tela, Espuma (2)») + un panel oculto por
           defecto (hidden) con casillas <input type="checkbox"> del MISMO patrón
           visual del formulario (.casilla: caja de 20 px dentro de un objetivo
           ≥44 px, foco visible en la casilla entera) y su botón «Limpiar»
           (RF-1601/RF-1606). El panel de tipo lleva las CINCO casillas fijas en su
           orden (Tela, Espuma, Estructuras, Otros, Sin tipo); el de provincia se
           rellena en memoria desde app.js (espejo de los datos) con la casilla FIJA
           «Sin provincia» anclada AL FINAL, siempre visible (RF-1603). Los paneles
           son hijos de la barra: la hoja oculta .barra-filtros entera, así que ni
           triggers, ni paneles, ni casillas viajan al papel ni al PDF (RF-1606).
           Las marcas viven SOLO en memoria: ninguna clave nueva (RF-1609) -->
      <div class="barra-filtros">
        <!-- Grupo TIPO: cinco casillas estáticas (RF-1602) -->
        <div class="desplegable-filtro" id="filtro-tipo">
          <button type="button" class="trigger-filtro" id="trigger-tipo"
                  aria-expanded="false" aria-controls="panel-tipo">
            <span class="trigger-texto">Tipo: Todos</span>
          </button>
          <div class="panel-filtro" id="panel-tipo" role="group"
               aria-label="Filtrar por tipo de cliente" hidden>
            <div class="panel-casillas">
              <label class="casilla" for="filtro-tipo-tela">
                <input type="checkbox" id="filtro-tipo-tela" value="Tela">
                <span>Tela</span>
              </label>
              <label class="casilla" for="filtro-tipo-espuma">
                <input type="checkbox" id="filtro-tipo-espuma" value="Espuma">
                <span>Espuma</span>
              </label>
              <label class="casilla" for="filtro-tipo-estructuras">
                <input type="checkbox" id="filtro-tipo-estructuras" value="Estructuras">
                <span>Estructuras</span>
              </label>
              <label class="casilla" for="filtro-tipo-otros">
                <input type="checkbox" id="filtro-tipo-otros" value="Otros">
                <span>Otros</span>
              </label>
              <label class="casilla" for="filtro-tipo-sin-tipo">
                <input type="checkbox" id="filtro-tipo-sin-tipo" value="Sin tipo">
                <span>Sin tipo</span>
              </label>
            </div>
            <div class="panel-pie">
              <button type="button" class="boton-secundario panel-limpiar"
                      data-limpiar="tipo">Limpiar</button>
            </div>
          </div>
        </div>

        <!-- Grupo PROVINCIA: casillas dinámicas (espejo de los datos, RF-1603) +
             casilla FIJA «Sin provincia» anclada al final + «Limpiar» -->
        <div class="desplegable-filtro" id="filtro-provincia">
          <button type="button" class="trigger-filtro" id="trigger-provincia"
                  aria-expanded="false" aria-controls="panel-provincias">
            <span class="trigger-texto">Provincia: Todas</span>
          </button>
          <div class="panel-filtro" id="panel-provincias" role="group"
               aria-label="Filtrar por provincia" hidden>
            <!-- Una casilla por provincia de los clientes que pasan el grupo tipo
                 (únicas por normalizar, orden alfabético «es»): app.js la genera
                 aquí con escaparAtributo (texto libre de los datos) -->
            <div class="panel-casillas" id="casillas-provincias"></div>
            <!-- Opción FIJA, siempre presente y SIEMPRE al final del panel: no
                 depende de los datos ni del grupo tipo y nunca se desmarca sola
                 por repueblado (RF-1603/RF-1605, Decisión 11). Su value vacío es
                 la marca SIN_PROVINCIA de logica.js (provincia vacía o ausente) -->
            <label class="casilla" for="filtro-provincia-sin-provincia">
              <input type="checkbox" id="filtro-provincia-sin-provincia" value="">
              <span>Sin provincia</span>
            </label>
            <div class="panel-pie">
              <button type="button" class="boton-secundario panel-limpiar"
                      data-limpiar="provincia">Limpiar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Buscador por texto (spec 005): SIN CAMBIOS de interfaz ni de
           semántica (RF-1601, spec 005 intacta) y al final de la barra -->
      <div class="buscador">
        <label for="buscador">Buscar cliente</label>
        <input type="search" id="buscador" autocomplete="off"
               placeholder="Empresa, contacto, CIF…">
      </div>

      <!-- Copia de seguridad (spec 011, RF-901): exportar e importar -->
      <div class="copia-seguridad">
        <button type="button" class="boton-secundario" id="boton-exportar">Exportar</button>
        <button type="button" class="boton-secundario" id="boton-importar">Importar</button>
        <input type="file" id="archivo-importar" accept=".json,application/json" hidden>
      </div>

      <!-- Confirmación EN LÍNEA de la importación (estilo «¿Seguro?», nunca confirm()/alert()) -->
      <div class="confirmacion-importacion" id="confirmacion-importacion" hidden>
        <p class="confirmacion-importacion-texto" id="confirmacion-importacion-texto"></p>
        <button type="button" class="boton-secundario boton-reemplazar" id="boton-reemplazar">Sí, reemplazar</button>
        <button type="button" class="boton-secundario" id="boton-cancelar-importacion">Cancelar</button>
      </div>

      <!-- Selector de campos del listado (spec 012, RF-1002): chips con estado de
           casilla, generados desde CATALOGO_CAMPOS; oculto en vista «Tarjetas» -->
      <div class="selector-campos" id="selector-campos" hidden>
        <p class="selector-campos-titulo" id="selector-campos-titulo">Campos del listado</p>
        <div class="chips" id="chips" role="group" aria-labelledby="selector-campos-titulo"></div>
      </div>

      <div class="lista-clientes" id="lista-clientes"></div>
    </section>

  </main>

  <!-- Aviso breve tipo toast (Cliente actualizado / Cliente eliminado) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="logica.js"></script>
  <script src="app.js"></script>
</body>
</html>
