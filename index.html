<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Clientes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor">
      <h1>Gestor de Clientes</h1>
    </div>
  </header>

  <main class="contenedor">

    <!-- Formulario para registrar un cliente -->
    <section class="panel" id="panel-formulario">
      <h2 id="titulo-formulario">Nuevo cliente</h2>

      <form id="formulario-cliente">
        <div class="campo">
          <label for="empresa">Nombre de la empresa</label>
          <input type="text" id="empresa" name="empresa" autocomplete="organization">
        </div>

        <div class="campo">
          <label for="cif">CIF/NIF</label>
          <input type="text" id="cif" name="cif" autocomplete="off">
        </div>

        <div class="campo">
          <label for="contacto">Persona de contacto</label>
          <input type="text" id="contacto" name="contacto" autocomplete="name">
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel">
        </div>

        <div class="campo">
          <label for="movil">Móvil</label>
          <input type="tel" id="movil" name="movil" autocomplete="off">
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email">
        </div>

        <div class="campo">
          <label for="direccion">Dirección física</label>
          <input type="text" id="direccion" name="direccion" autocomplete="street-address">
        </div>

        <div class="campo">
          <label for="codigo-postal">Código postal</label>
          <input type="text" id="codigo-postal" name="codigoPostal" autocomplete="postal-code" inputmode="numeric">
        </div>

        <!-- Provincia (spec 015, RF-1302): campo combinado — el datalist solo
             SUGIERE las 52 provincias/ciudades de España (las 4 principales
             primero: Valencia, Alicante, Castellón, Murcia; el resto
             alfabético) y se permite escribir cualquier texto libre; nada es
             obligatorio (spec 007) y sin maxlength (la lógica solo recorta) -->
        <div class="campo">
          <label for="provincia">Provincia</label>
          <input type="text" id="provincia" name="provincia" list="lista-provincias" autocomplete="address-level2">
          <datalist id="lista-provincias">
            <option value="Valencia"></option>
            <option value="Alicante"></option>
            <option value="Castellón"></option>
            <option value="Murcia"></option>
            <option value="A Coruña"></option>
            <option value="Álava"></option>
            <option value="Albacete"></option>
            <option value="Almería"></option>
            <option value="Asturias"></option>
            <option value="Ávila"></option>
            <option value="Badajoz"></option>
            <option value="Barcelona"></option>
            <option value="Bizkaia"></option>
            <option value="Burgos"></option>
            <option value="Cáceres"></option>
            <option value="Cádiz"></option>
            <option value="Cantabria"></option>
            <option value="Ceuta"></option>
            <option value="Ciudad Real"></option>
            <option value="Córdoba"></option>
            <option value="Cuenca"></option>
            <option value="Gipuzkoa"></option>
            <option value="Girona"></option>
            <option value="Granada"></option>
            <option value="Guadalajara"></option>
            <option value="Huelva"></option>
            <option value="Huesca"></option>
            <option value="Illes Balears"></option>
            <option value="Jaén"></option>
            <option value="La Rioja"></option>
            <option value="Las Palmas"></option>
            <option value="León"></option>
            <option value="Lleida"></option>
            <option value="Lugo"></option>
            <option value="Madrid"></option>
            <option value="Málaga"></option>
            <option value="Melilla"></option>
            <option value="Navarra"></option>
            <option value="Ourense"></option>
            <option value="Palencia"></option>
            <option value="Pontevedra"></option>
            <option value="Salamanca"></option>
            <option value="Santa Cruz de Tenerife"></option>
            <option value="Segovia"></option>
            <option value="Sevilla"></option>
            <option value="Soria"></option>
            <option value="Tarragona"></option>
            <option value="Teruel"></option>
            <option value="Toledo"></option>
            <option value="Valladolid"></option>
            <option value="Zamora"></option>
            <option value="Zaragoza"></option>
          </datalist>
        </div>

        <!-- Tipos de cliente (spec 014, RF-1203): chips de selección múltiple en
             lugar del desplegable de la 008. Los tres chips fijos los pinta
             app.js desde TIPOS_FIJOS (fuente única) y los libres (con su «×»)
             se añaden con el campo de abajo; nada es obligatorio (spec 007) -->
        <div class="campo">
          <p class="campo-titulo" id="titulo-tipos">Tipos de cliente</p>
          <div class="chips" id="chips-tipos" role="group" aria-labelledby="titulo-tipos"></div>
        </div>

        <!-- Cada texto se limita a 40 caracteres SOLO aquí, en el formulario:
             la lógica y la importación no truncan (RF-1203/RF-1209) -->
        <div class="campo">
          <label for="tipo-otro">Añadir otro tipo</label>
          <div class="anadir-tipo">
            <input type="text" id="tipo-otro" autocomplete="off" maxlength="40" placeholder="p. ej. Toldos">
            <button type="button" class="boton-secundario" id="boton-anadir-tipo">Añadir</button>
          </div>
        </div>

        <div class="campo campo-completo">
          <label for="notas">Información adicional / Notas</label>
          <textarea id="notas" name="notas" autocomplete="off" rows="4"></textarea>
        </div>

        <div class="campo campo-completo">
          <div class="acciones-formulario">
            <button type="submit" class="boton-principal" id="boton-guardar">Guardar cliente</button>
            <button type="button" class="boton-secundario" id="boton-cancelar" hidden>Cancelar</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Lista de clientes -->
    <section class="panel">
      <!-- Cabecera de contexto impresa (spec 013, RF-1103): existe SOLO para el
           papel; en pantalla está oculta (styles.css) y el texto lo rellena app.js
           en el evento «beforeprint», al imprimir -->
      <p class="cabecera-impresion" id="cabecera-impresion" aria-hidden="true"></p>

      <div class="lista-cabecera">
        <h2>Clientes</h2>

        <!-- Conmutador de vista (spec 012, RF-1001): «Tarjetas» activo por defecto;
             el estado (vistaActual) vive solo en memoria, sin persistencia -->
        <div class="conmutador" id="conmutador" role="group" aria-label="Forma de ver la lista">
          <button type="button" class="activo" data-vista="tarjetas" aria-pressed="true">Tarjetas</button>
          <button type="button" data-vista="listado" aria-pressed="false">Listado</button>
        </div>

        <!-- Botón «Imprimir» (spec 013, RF-1101): tras el conmutador y visible en las
             dos vistas; imprime lo que se ve y no toca datos, filtro, búsqueda ni vista -->
        <button type="button" class="boton-secundario" id="boton-imprimir">Imprimir</button>

        <p class="contador" id="contador"></p>
      </div>

      <!-- Buscador por texto (spec 005) -->
      <div class="buscador">
        <label for="buscador">Buscar cliente</label>
        <input type="search" id="buscador" autocomplete="off"
               placeholder="Empresa, contacto, CIF…">
      </div>

      <div class="filtros" id="filtros">
        <button type="button" class="filtro activo" data-filtro="Todos">Todos</button>
        <button type="button" class="filtro" data-filtro="Tela">Tela</button>
        <button type="button" class="filtro" data-filtro="Espuma">Espuma</button>
        <button type="button" class="filtro" data-filtro="Estructuras">Estructuras</button>
        <button type="button" class="filtro" data-filtro="Otros">Otros</button>
      </div>

      <!-- Filtro por provincia (spec 015, RF-1305): desplegable junto a las
           pestañas de tipo. La opción «Todas las provincias» (por defecto) está
           en el HTML; el repoblado con las provincias de los clientes —y la
           combinación en Y con tipo y búsqueda— lo hace app.js (T-05) -->
      <div class="filtro-provincia-bloque">
        <label class="filtro-provincia" for="filtro-provincia">Provincia</label>
        <select id="filtro-provincia" class="filtro-provincia-select">
          <option value="" selected>Todas las provincias</option>
        </select>
      </div>

      <!-- Copia de seguridad (spec 011, RF-901): exportar e importar -->
      <div class="copia-seguridad">
        <button type="button" class="boton-secundario" id="boton-exportar">Exportar</button>
        <button type="button" class="boton-secundario" id="boton-importar">Importar</button>
        <input type="file" id="archivo-importar" accept=".json,application/json" hidden>
      </div>

      <!-- Confirmación EN LÍNEA de la importación (estilo «¿Seguro?», nunca confirm()/alert()) -->
      <div class="confirmacion-importacion" id="confirmacion-importacion" hidden>
        <p class="confirmacion-importacion-texto" id="confirmacion-importacion-texto"></p>
        <button type="button" class="boton-secundario boton-reemplazar" id="boton-reemplazar">Sí, reemplazar</button>
        <button type="button" class="boton-secundario" id="boton-cancelar-importacion">Cancelar</button>
      </div>

      <!-- Selector de campos del listado (spec 012, RF-1002): chips con estado de
           casilla, generados desde CATALOGO_CAMPOS; oculto en vista «Tarjetas» -->
      <div class="selector-campos" id="selector-campos" hidden>
        <p class="selector-campos-titulo" id="selector-campos-titulo">Campos del listado</p>
        <div class="chips" id="chips" role="group" aria-labelledby="selector-campos-titulo"></div>
      </div>

      <div class="lista-clientes" id="lista-clientes"></div>
    </section>

  </main>

  <!-- Aviso breve tipo toast (Cliente actualizado / Cliente eliminado) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="logica.js"></script>
  <script src="app.js"></script>
</body>
</html>
