<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Clientes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de acceso con clave (spec 006) -->
  <div class="acceso" id="pantalla-acceso">
    <form class="acceso-tarjeta" id="formulario-acceso">
      <h1>Acceso</h1>
      <label for="clave-acceso">Tu clave</label>
      <input type="password" id="clave-acceso" inputmode="numeric" autocomplete="current-password" required>
      <p class="acceso-error" id="error-acceso" hidden>Clave incorrecta. Inténtalo de nuevo.</p>
      <label class="acceso-recordar" for="recordar-sesion">
        <input type="checkbox" id="recordar-sesion"> Mantener sesión iniciada
      </label>
      <button type="submit" class="boton-principal">Entrar</button>
      <p class="acceso-nota">¿Sin clave? Pide al administrador.<br>
        Aviso: la clave es disuasoria (la app funciona sin servidor).</p>
    </form>
  </div>

  <div id="contenido-app" hidden>

  <header class="cabecera">
    <div class="contenedor cabecera-contenido">
      <div>
        <h1>Gestor de Clientes</h1>
        <p>Clientes de tela, espuma y estructuras</p>
      </div>
      <button type="button" class="boton-salir" id="boton-salir">Salir</button>
    </div>
  </header>

  <main class="contenedor">

    <!-- Formulario para registrar un cliente -->
    <section class="panel" id="panel-formulario">
      <h2 id="titulo-formulario">Nuevo cliente</h2>

      <form id="formulario-cliente">
        <div class="campo">
          <label for="empresa">Nombre de la empresa</label>
          <input type="text" id="empresa" name="empresa" autocomplete="organization">
        </div>

        <div class="campo">
          <label for="cif">CIF/NIF</label>
          <input type="text" id="cif" name="cif" autocomplete="off">
        </div>

        <div class="campo">
          <label for="contacto">Persona de contacto</label>
          <input type="text" id="contacto" name="contacto" autocomplete="name">
        </div>

        <div class="campo">
          <label for="telefono">Teléfono de contacto</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel">
        </div>

        <div class="campo">
          <label for="movil">Móvil</label>
          <input type="tel" id="movil" name="movil" autocomplete="off">
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email">
        </div>

        <div class="campo">
          <label for="direccion">Dirección física</label>
          <input type="text" id="direccion" name="direccion" autocomplete="street-address">
        </div>

        <div class="campo">
          <label for="codigo-postal">Código postal</label>
          <input type="text" id="codigo-postal" name="codigoPostal" autocomplete="postal-code" inputmode="numeric">
        </div>

        <div class="campo">
          <label for="tipo">Tipo de cliente</label>
          <select id="tipo" name="tipo" autocomplete="off">
            <option value="" selected disabled>Selecciona un tipo</option>
            <option value="Tela">Tela</option>
            <option value="FOAM">Espuma</option>
            <option value="Estructuras">Estructuras</option>
          </select>
        </div>

        <div class="campo campo-completo">
          <label for="notas">Información adicional / Notas</label>
          <textarea id="notas" name="notas" autocomplete="off" rows="4"></textarea>
        </div>

        <div class="campo campo-completo">
          <div class="acciones-formulario">
            <button type="submit" class="boton-principal" id="boton-guardar">Guardar cliente</button>
            <button type="button" class="boton-secundario" id="boton-cancelar" hidden>Cancelar</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Lista de clientes -->
    <section class="panel">
      <div class="lista-cabecera">
        <h2>Clientes</h2>
        <p class="contador" id="contador"></p>
      </div>

      <!-- Buscador por texto (spec 005) -->
      <div class="buscador">
        <label for="buscador">Buscar cliente</label>
        <input type="search" id="buscador" autocomplete="off"
               placeholder="Escribe palabras: empresa, contacto, CIF…">
      </div>

      <div class="filtros" id="filtros">
        <button type="button" class="filtro activo" data-filtro="Todos">Todos</button>
        <button type="button" class="filtro" data-filtro="Tela">Tela</button>
        <button type="button" class="filtro" data-filtro="FOAM">Espuma</button>
        <button type="button" class="filtro" data-filtro="Estructuras">Estructuras</button>
      </div>

      <div class="lista-clientes" id="lista-clientes"></div>
    </section>

    <!-- Herramientas del administrador (spec 006, solo visible con su clave) -->
    <section class="panel panel-admin" id="panel-admin" hidden>
      <h2>Herramientas del administrador</h2>

      <div class="admin-fila">
        <button type="button" class="boton-secundario" id="boton-exportar">Exportar clientes (JSON)</button>
        <button type="button" class="boton-secundario" id="boton-importar">Importar clientes (JSON)</button>
        <input type="file" id="archivo-importar" accept=".json,application/json" hidden>
      </div>

      <!-- Confirmación de la importación (sin confirm() nativo) -->
      <div class="confirmar-importacion" id="confirmar-importacion" hidden>
        <p id="texto-confirmacion"></p>
        <div class="admin-fila">
          <button type="button" class="boton-peligro" id="boton-si-reemplazar">Sí, reemplazar</button>
          <button type="button" class="boton-secundario" id="boton-cancelar-importar">Cancelar</button>
        </div>
      </div>

      <h3>Cambiar claves</h3>
      <div class="admin-fila">
        <div class="campo">
          <label for="clave-nueva-usuario">Nueva clave de usuario</label>
          <input type="password" id="clave-nueva-usuario" inputmode="numeric" autocomplete="new-password">
        </div>
        <div class="campo">
          <label for="clave-nueva-admin">Nueva clave de administrador</label>
          <input type="password" id="clave-nueva-admin" inputmode="numeric" autocomplete="new-password">
        </div>
      </div>
      <button type="button" class="boton-secundario" id="boton-guardar-claves">Guardar claves</button>
    </section>

  </main>

  </div><!-- /#contenido-app -->

  <!-- Aviso breve tipo toast (Cliente actualizado / Cliente eliminado) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="logica.js"></script>
  <script src="app.js"></script>
</body>
</html>
